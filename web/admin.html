<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>온열질환 자가진단 - 관리자</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<div id="loginSection">
  <div class="login-card">
    <h1>관리자 로그인</h1>
    <p>온열질환 자가진단 관리자 대시보드</p>
    <div class="field">
      <input type="password" id="loginPwd" placeholder="비밀번호" />
    </div>
    <button id="loginBtn" type="button" class="btn btn-primary">로그인</button>
    <div id="loginMsg" class="msg-box msg-error"></div>
  </div>
</div>

<div id="dashboardSection">
  <div class="header-bar">
    <h2>온열질환 자가진단 관리자</h2>
    <button id="logoutBtn" type="button" class="btn btn-outline">로그아웃</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">오늘 응답 수</div>
      <div class="kpi-value" id="kpiToday">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">경고/위험 누적</div>
      <div class="kpi-value danger" id="kpiAlert">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">미확인 건</div>
      <div class="kpi-value danger" id="kpiUnconfirmed">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">등록 현장 수</div>
      <div class="kpi-value" id="kpiSites">0</div>
    </div>
  </div>

  <div class="filter-card">
    <div class="filter-group">
      <label>현장</label>
      <select id="filterSite"></select>
    </div>
    <div class="filter-group">
      <label>등급</label>
      <select id="filterLevel">
        <option value="">전체 등급</option>
        <option value="정상">정상</option>
        <option value="관찰">관찰</option>
        <option value="경고">경고</option>
        <option value="위험">위험</option>
      </select>
    </div>
    <div class="filter-group">
      <label>상태</label>
      <select id="filterStatus">
        <option value="">전체 상태</option>
        <option value="미확인">미확인</option>
        <option value="조치중">조치중</option>
        <option value="완료">완료</option>
      </select>
    </div>
    <button id="refreshBtn" type="button" class="btn btn-primary">새로고침</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>시각</th><th>현장</th><th>이름</th><th>등급</th><th>점수</th><th>상태</th><th>조치</th>
        </tr>
      </thead>
      <tbody id="submissionsBody"></tbody>
    </table>
  </div>

  <div class="site-manage">
    <h3>현장 추가</h3>
    <div class="site-manage-form">
      <input type="text" id="newSiteName" placeholder="새 현장명" />
      <button id="addSiteBtn" type="button" class="btn btn-primary">추가</button>
    </div>
    <div id="siteManageMsg" class="msg-box msg-error"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
